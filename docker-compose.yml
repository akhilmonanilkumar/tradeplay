# Self-hosted deployment: app behind Caddy (automatic HTTPS).
#   APP_IMAGE=ghcr.io/akhilmonanilkumar/tradeplay:latest DOMAIN=journal.example.com docker compose up -d
# Rolling updates: scripts/rolling-deploy.sh (used by the release workflow).

services:
  app:
    image: ${APP_IMAGE:-ghcr.io/akhilmonanilkumar/tradeplay:latest}
    build:
      context: .
      args:
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
    environment:
      ALLOWED_IPS: ${ALLOWED_IPS:-}
    expose:
      - "3000"          # no host port: only Caddy can reach it, and 2 replicas can run during a rollout
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    deploy:
      resources:
        limits: { memory: 512m, cpus: "1.0" }
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 10s
      timeout: 3s
      start_period: 15s
      retries: 3
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  caddy:
    image: caddy:2-alpine
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: ["no-new-privileges:true"]

volumes:
  caddy_data:
  caddy_config:
