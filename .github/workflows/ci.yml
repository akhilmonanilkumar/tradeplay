# Quality gate for every push and pull request.
# Vercel deploys previews/production from Git on its own; this workflow makes sure broken code never gets there.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL || 'https://drdpzpaeuvelbsdxhndw.supabase.co' }}
  NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'sb_publishable_4hGP148iMgHFKwIZhBO5eg_tNt_Ycu1' }}
  NEXT_TELEMETRY_DISABLED: 1

jobs:
  verify:
    name: Test & build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Unit tests (sizing, risk ladder, guardrails, discipline)
        run: npm test
      - name: Type-check & production build
        run: npm run build
      - name: Dependency audit (high+)
        run: npm audit --omit=dev --audit-level=high

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: tradeplay:ci
          build-args: |
            NEXT_PUBLIC_SUPABASE_URL=${{ env.NEXT_PUBLIC_SUPABASE_URL }}
            NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ env.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test container
        run: |
          docker run -d --name t -p 3000:3000 --read-only --tmpfs /tmp --cap-drop ALL tradeplay:ci
          for i in $(seq 1 30); do
            s=$(docker inspect -f '{{.State.Health.Status}}' t); [ "$s" = healthy ] && break; sleep 2
          done
          docker inspect -f '{{.State.Health.Status}}' t | grep -qx healthy
          curl -fsS http://127.0.0.1:3000/api/health
          curl -fsSI http://127.0.0.1:3000/login | grep -i "content-security-policy: .*nonce-"
          docker exec t whoami | grep -qx app
