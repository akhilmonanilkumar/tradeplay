# Quality gate for every push and pull request.
# Vercel deploys previews/production from Git on its own; this workflow makes sure broken code never gets there.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL || 'https://drdpzpaeuvelbsdxhndw.supabase.co' }}
  NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'sb_publishable_4hGP148iMgHFKwIZhBO5eg_tNt_Ycu1' }}
  NEXT_TELEMETRY_DISABLED: 1

jobs:
  verify:
    name: Test & build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Unit tests (sizing, risk ladder, guardrails, discipline)
        run: npm test
      - name: Type-check & production build
        run: npm run build
      - name: Dependency audit (high+)
        run: npm audit --omit=dev --audit-level=high

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: Build image (classic builder, stays in the local image store)
        run: |
          docker build \
            --build-arg NEXT_PUBLIC_SUPABASE_URL="$NEXT_PUBLIC_SUPABASE_URL" \
            --build-arg NEXT_PUBLIC_SUPABASE_ANON_KEY="$NEXT_PUBLIC_SUPABASE_ANON_KEY" \
            -t tradeplay:ci .
          docker image ls tradeplay
      - name: Smoke test container
        run: |
          note() { echo "::error title=smoke::$(printf '%s' "$*" | tr '\n' ' ' | cut -c1-900)"; }
          on_exit() {
            rc=$?
            if [ $rc -ne 0 ]; then
              note "exit=$rc step=$STEP"
              note "ps: $(docker ps -a --format '{{.Names}} {{.Status}}' 2>&1)"
              note "state: $(docker inspect t --format '{{json .State}}' 2>&1)"
              note "logs: $(docker logs t 2>&1 | tail -30)"
            fi
          }
          trap on_exit EXIT
          STEP=run;     out=$(docker run -d --name t -p 3000:3000 --read-only --tmpfs /tmp --cap-drop ALL --security-opt no-new-privileges tradeplay:ci 2>&1) || { note "docker run: $out"; exit 125; }
          STEP=health
          status=starting
          for i in $(seq 1 45); do
            status=$(docker inspect -f '{{.State.Health.Status}}' t 2>/dev/null || echo missing)
            [ "$status" = healthy ] && break
            [ "$(docker inspect -f '{{.State.Running}}' t)" = true ] || break
            sleep 2
          done
          [ "$status" = healthy ] || { note "health=$status"; exit 1; }
          STEP=curl-health; curl -fsS http://127.0.0.1:3000/api/health
          STEP=csp;         curl -fsSI http://127.0.0.1:3000/login | grep -iE "content-security-policy: .*nonce-"
          STEP=user;        u=$(docker exec t id -un 2>&1) || { note "exec: $u"; exit 1; }
          [ "$u" = app ] || { note "user=$u"; exit 1; }
