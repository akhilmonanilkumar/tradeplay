# Quality gate for every push and pull request.
# Vercel deploys previews/production from Git on its own; this workflow makes sure broken code never gets there.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL || 'https://drdpzpaeuvelbsdxhndw.supabase.co' }}
  NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'sb_publishable_4hGP148iMgHFKwIZhBO5eg_tNt_Ycu1' }}
  NEXT_TELEMETRY_DISABLED: 1

jobs:
  verify:
    name: Test & build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Unit tests (sizing, risk ladder, guardrails, discipline)
        run: npm test
      - name: Type-check & production build
        run: npm run build
      - name: Dependency audit (high+)
        run: npm audit --omit=dev --audit-level=high

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: Build image (classic builder, stays in the local image store)
        run: |
          docker build \
            --build-arg NEXT_PUBLIC_SUPABASE_URL="$NEXT_PUBLIC_SUPABASE_URL" \
            --build-arg NEXT_PUBLIC_SUPABASE_ANON_KEY="$NEXT_PUBLIC_SUPABASE_ANON_KEY" \
            -t tradeplay:ci .
          docker image ls tradeplay
      - name: Smoke test container
        run: |
          set -x
          trap 'echo "::group::container logs"; docker ps -a; docker logs t 2>&1 | tail -80 || true; docker inspect t --format "{{json .State}}" || true; echo "::endgroup::"' EXIT
          docker run -d --name t -p 3000:3000 --read-only --tmpfs /tmp --cap-drop ALL --security-opt no-new-privileges tradeplay:ci
          status=starting
          for i in $(seq 1 45); do
            status=$(docker inspect -f '{{.State.Health.Status}}' t 2>/dev/null || echo missing)
            [ "$status" = healthy ] && break
            [ "$(docker inspect -f '{{.State.Running}}' t)" = true ] || break
            sleep 2
          done
          test "$status" = healthy
          curl -fsS http://127.0.0.1:3000/api/health
          curl -fsSI http://127.0.0.1:3000/login | grep -iE "content-security-policy: .*nonce-"
          test "$(docker exec t id -un)" = app
